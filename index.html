    group: ["הקבצה", "רצועה", "מקבץ", "group", "block"],
  };
  E.detectColumns = function (headers) {
    const norm = s => String(s || "").replace(/["'״׳]/g, "").replace(/\s+/g, " ").trim().toLowerCase();
    const map = {};
    headers.forEach((h, i) => {
      const n = norm(h);
      for (const key in E.HEADER_ALIASES) {
        if (map[key] !== undefined) continue;
        if (E.HEADER_ALIASES[key].some(a => norm(a) === n)) { map[key] = i; return; }
      }
    });
    headers.forEach((h, i) => {
      const n = norm(h);
      for (const key in E.HEADER_ALIASES) {
        if (map[key] !== undefined) continue;
        if (Object.values(map).indexOf(i) >= 0) continue;
        if (E.HEADER_ALIASES[key].some(a => n.indexOf(norm(a)) >= 0)) { map[key] = i; return; }
      }
    });
    return map;
  };
  E.parseDay = function (v, days) {
    const s = String(v || "").replace(/["'״׳]/g, "").replace("יום", "").trim();
    if (/^\d+$/.test(s)) { const n = +s; return n >= 1 && n <= days.length ? n - 1 : -1; }
    const names = ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי"];
    let i = names.indexOf(s); if (i >= 0) return i < days.length ? i : -1;
    i = days.indexOf(s); if (i >= 0) return i;
    i = E.DAY_NAMES.indexOf(s); return i >= 0 && i < days.length ? i : -1;
  };

  // rows: array of objects {teacher, subject, klass, day?, period?, room?, hours?, group?}
  // Builds data (teachers/classes/rooms/reqs) and optional placements, merging into base data.
  E.importRows = function (base, rows, mode) {
    const data = JSON.parse(JSON.stringify(base));
    const cfg = data.config;
    const P = Math.max.apply(null, cfg.periods);
    const byName = (list, name) => list.find(x => x.name === name);
    const report = { teachers: 0, classes: 0, rooms: 0, reqs: 0, placed: 0, skipped: [] };
    const getTeacher = name => {
      name = String(name || "").trim(); if (!name) return null;
      let t = byName(data.teachers, name);
      if (!t) { t = { id: E.uid("t"), name, subjects: [], off: [] }; data.teachers.push(t); report.teachers++; }
      return t;
    };
    const getClass = name => {
      name = String(name || "").trim(); if (!name) return null;
      let c = byName(data.classes, name);
      if (!c) { c = { id: E.uid("c"), name, grade: name.replace(/\d+$/, "").trim() }; data.classes.push(c); report.classes++; }
      return c;
    };
    const getRoom = name => {
      name = String(name || "").trim(); if (!name) return null;
      let r = byName(data.rooms, name);
      if (!r) { r = { id: E.uid("r"), name, type: "כיתה" }; data.rooms.push(r); report.rooms++; }
      return r;
    };
    const placements = {};
    if (mode === "timetable") {
      // 0) adapt the week to the file: hour 0, Friday, more periods per day
      const norm = rows.map((row, i) => {
        let d = E.parseDay(row.day, cfg.days);
        if (d < 0) { const d6 = E.parseDay(row.day, ["א", "ב", "ג", "ד", "ה", "ו"]); if (d6 === 5) d = 5; }
        const pn = parseInt(String(row.period == null ? "" : row.period).replace(/[^\d]/g, ""), 10);
        return { i, d, pn, row };
      });
      if (norm.some(x => x.d === 5) && cfg.days.length === 5) { cfg.days = cfg.days.concat(["ו"]); cfg.periods = cfg.periods.concat([6]); report.configChanged = true; }
      if (norm.some(x => x.pn === 0) && (cfg.firstPeriod || 0) === 1) { cfg.firstPeriod = 0; cfg.periods = cfg.periods.map(n => n + 1); if (cfg.times) cfg.times.unshift(["", ""]); report.configChanged = true; }
      const fp0 = cfg.firstPeriod || 0;
      norm.forEach(x => { if (x.d >= 0 && x.pn >= 0) { const need = x.pn - fp0 + 1; if (need > cfg.periods[x.d] && need <= 14) { cfg.periods[x.d] = need; report.configChanged = true; } } });
      const P2 = Math.max.apply(null, cfg.periods);
      // 1) one entry per (slot, teacher, subject); classes of the same lesson are merged
      const entries = new Map();
      norm.forEach(x => {
        const p = x.pn - fp0;
        if (x.d < 0 || !(p >= 0 && p < P2) || isNaN(x.pn)) { report.skipped.push("שורה " + (x.i + 2) + ": יום/שעה לא מזוהים (" + (x.row.day || "") + " " + (x.row.period || "") + ")"); return; }
        const subject = String(x.row.subject || "").trim(), teacher = String(x.row.teacher || "").trim();
        if (!subject && !teacher) { report.skipped.push("שורה " + (x.i + 2) + ": חסרים מקצוע ומורה"); return; }
        const classNames = String(x.row.klass || "").split(/[,+;\/]/).map(v => v.trim()).filter(Boolean);
        const s = x.d * P2 + p;
        const key = s + "|" + (teacher ? "t:" + teacher + "|" + subject : "c:" + classNames.slice().sort().join(",") + "|" + subject);
        let e = entries.get(key);
        if (!e) entries.set(key, e = { s, subject: subject || "שיעור", teacher, classes: new Set(), room: "", group: "" });
        classNames.forEach(n => e.classes.add(n));
        if (!e.room && x.row.room) e.room = String(x.row.room).trim();
        if (!e.group && x.row.group) e.group = String(x.row.group).trim();
      });
      // 2) per slot: lessons that share a class run in parallel = one block (הקבצה / מגמה / בנים-בנות)
      const bySlot = new Map();
      entries.forEach(e => { let a = bySlot.get(e.s); if (!a) bySlot.set(e.s, a = []); a.push(e); });
      const blocks = new Map(); // signature -> {classes, groups, label, slots:[{s, rooms}]}
      bySlot.forEach((list, s) => {
        const parent = list.map((_, i) => i);
        const find = i => parent[i] === i ? i : (parent[i] = find(parent[i]));
        const owner = new Map();
        list.forEach((e, i) => {
          e.classes.forEach(c => { if (owner.has(c)) parent[find(i)] = find(owner.get(c)); else owner.set(c, i); });
          if (e.group) { const gk = "#g:" + e.group; if (owner.has(gk)) parent[find(i)] = find(owner.get(gk)); else owner.set(gk, i); }
        });
        const comps = new Map();
        list.forEach((e, i) => { const r = find(i); let a = comps.get(r); if (!a) comps.set(r, a = []); a.push(e); });
        comps.forEach(members => {
          members.sort((a, b) => (a.subject + a.teacher).localeCompare(b.subject + b.teacher));
          const classes = Array.from(new Set([].concat.apply([], members.map(m => Array.from(m.classes))))).sort();
          const sig = classes.join(",") + "||" + members.map(m => m.subject + "|" + m.teacher).join(";");
          let b = blocks.get(sig);
          if (!b) blocks.set(sig, b = { classes, groups: members.map(m => ({ subject: m.subject, teacher: m.teacher })), label: (members.find(m => m.group) || {}).group || "", slots: [] });
          b.slots.push({ s, rooms: members.map(m => m.room) });
        });
      });
      // 3) one requirement per recurring block; placements keep the exact slots and rooms
      blocks.forEach(b => {
        const roomTypeOf = gi => { const names = b.slots.map(x => x.rooms[gi]).filter(Boolean); if (!names.length) return "כיתה"; const r = byName(data.rooms, names[0]) || getRoom(names[0]); return r.type || "כיתה"; };
        const groups = b.groups.map((g, gi) => {
          const t = getTeacher(g.teacher); if (t && g.subject && t.subjects.indexOf(g.subject) < 0) t.subjects.push(g.subject);
          return { subject: g.subject, teacherId: t ? t.id : null, roomType: roomTypeOf(gi) };
        });
        const classIds = b.classes.map(n => getClass(n).id);
        const slots = b.slots.sort((a, c) => a.s - c.s);
        const perDay = {}; slots.forEach(x => { const d = Math.floor(x.s / P2); perDay[d] = (perDay[d] || 0) + 1; });
        const dbl = slots.some((x, k) => k && slots[k - 1].s === x.s - 1);
        const req = { id: E.uid("q"), classIds, hours: slots.length, maxPerDay: Math.max.apply(null, Object.values(perDay)), double: dbl, groups };
        if (b.label) req.label = b.label;
        else if (groups.length > 1) req.label = Array.from(new Set(groups.map(g => g.subject.replace(/ \d$/, "")))).slice(0, 3).join("/") + " – " + b.classes.join(",");
        data.reqs.push(req); report.reqs++;
        if (groups.length > 1) report.blocks = (report.blocks || 0) + 1;
        slots.forEach((x, k) => {
          placements[E.pidOf(req.id, k)] = { s: x.s, rooms: x.rooms.map(n => { const rm = n ? getRoom(n) : null; return rm ? rm.id : null; }), locked: false };
          report.placed++;
        });
      });
    } else {
      // requirements: teacher, subject, class(es), hours, optional group (rows with same group = one block)
      const blocks = new Map();
      rows.forEach((row, i) => {
        const hours = parseInt(row.hours, 10);
        if (!(hours > 0)) { report.skipped.push("שורה " + (i + 2) + ": חסר מספר שעות"); return; }
        const classNames = String(row.klass || "").split(/[,+;\/]/).map(s => s.trim()).filter(Boolean);
        const t = getTeacher(row.teacher);
        const subject = String(row.subject || "").trim() || "שיעור";
        if (t && t.subjects.indexOf(subject) < 0) t.subjects.push(subject);
        const g = { subject, teacherId: t ? t.id : null, roomType: "כיתה" };
        if (row.room) { const rm = getRoom(row.room); g.room = rm.id; g.roomType = rm.type; }
        const classIds = classNames.map(n => getClass(n).id);
        if (row.group) {
          let b = blocks.get(row.group);
          if (!b) { b = { id: E.uid("q"), label: String(row.group), classIds: [], hours, maxPerDay: 1, double: false, groups: [] }; blocks.set(row.group, b); data.reqs.push(b); report.reqs++; }
          classIds.forEach(id => { if (b.classIds.indexOf(id) < 0) b.classIds.push(id); });
          b.hours = Math.max(b.hours, hours);
          b.groups.push(g);
        } else {
          data.reqs.push({ id: E.uid("q"), classIds, hours, maxPerDay: hours >= 5 ? 2 : 1, double: false, groups: [g] }); report.reqs++;
        }
      });
    }
    return { data, placements, report };
  };

  // Timetable grids (one table per class: rows = periods, columns = days, cell = subject / teacher / room)
  // sheets: [{name, aoa}] -> {rows:[{day,period,klass,subject,teacher,room}], classes:[...]} or null
  E.gridToRows = function (sheets) {
    const dayTok = v => { const t = String(v == null ? "" : v).replace(/["'״׳]/g, "").replace(/יום/g, "").trim(); const names = ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי"]; let i = names.indexOf(t); if (i < 0) i = E.DAY_NAMES.indexOf(t); return i; };
    const out = [], classes = [];
    sheets.forEach(sh => {
      const aoa = sh.aoa || [];
      // a sheet can hold several class tables stacked vertically
      for (let r = 0; r < aoa.length; r++) {
        const row = aoa[r] || [];
        const dayCols = []; row.forEach((v, c) => { const d = dayTok(v); if (d >= 0) dayCols.push({ c, d }); });
        if (dayCols.length < 3) continue;
        // class name: a cell above mentioning "כיתה", else the sheet name
        let klass = "";
        for (let k = r - 1; k >= Math.max(0, r - 4) && !klass; k--) (aoa[k] || []).forEach(v => { const m = /כית(?:ה|ת)\s*[:\-]?\s*([^\s,]+)/.exec(String(v || "")); if (m && !klass) klass = m[1]; });
        if (!klass) (row.slice(0, Math.min.apply(null, dayCols.map(x => x.c)))).forEach(v => { const t = String(v || "").trim(); if (t && !/שעה|^\d+$/.test(t) && !klass) klass = t; });
        if (!klass) klass = String(sh.name || "").trim();
        let added = 0;
        for (let k = r + 1; k < aoa.length; k++) {
          const rr = aoa[k] || [];
          if (rr.filter(v => dayTok(v) >= 0).length >= 3) break; // next table
          const lead = rr.slice(0, Math.min.apply(null, dayCols.map(x => x.c))).map(v => String(v == null ? "" : v).trim()).find(v => /^\d{1,2}$/.test(v) || /^שעה\s*\d{1,2}/.test(v));
          if (lead == null) { if (rr.every(v => !String(v == null ? "" : v).trim())) { if (added) break; else continue; } else continue; }
          const period = parseInt(String(lead).replace(/[^\d]/g, ""), 10);
          dayCols.forEach(({ c, d }) => {
            E.parseCell(rr[c]).forEach(x => { out.push({ day: E.DAY_NAMES[d], period, klass, subject: x.subject, teacher: x.teacher, room: x.room }); added++; });
          });
        }
        if (added && classes.indexOf(klass) < 0) classes.push(klass);
      }
    });
    return out.length ? { rows: out, classes } : null;
  };
  // one cell -> lessons. Supports "מקצוע – מורה (חדר) | ..." and multi-line "מקצוע\nמורה\nחדר"
  E.parseCell = function (v) {
    const txt = String(v == null ? "" : v).replace(/\r/g, "").trim(); if (!txt) return [];
    const parts = txt.indexOf("|") >= 0 ? txt.split("|") : txt.split(/\n\s*\n/);
    const res = [];
    parts.map(x => x.trim()).filter(Boolean).forEach(part => {
      let subject = "", teacher = "", room = "";
      const pm = /\(([^)]+)\)\s*$/.exec(part); if (pm) { room = pm[1].trim(); part = part.slice(0, pm.index).trim(); }
      const lines = part.split("\n").map(x => x.trim()).filter(Boolean);
      if (lines.length >= 2) {
        subject = lines[0]; teacher = lines[1];
        if (!room && lines[2]) room = lines[2].replace(/^חדר\s*/, "");
      } else {
        const m = part.split(/\s+[–-]\s+/);
        subject = m[0].trim(); teacher = (m[1] || "").trim();
        if (m[2] && !room) room = m[2].trim();
      }
      res.push({ subject, teacher, room });
    });
    return res;
  };

  // flat export rows (for Excel / Shahaf)
  E.exportRows = function (M, placements) {
    const data = M.data, out = [];
    for (const pid in placements) {
      const pl = placements[pid]; const ri = M.reqIdx.get(E.reqOfPid(pid)); if (ri === undefined) continue;
      const r = M.reqs[ri].src; const { d, p } = E.slotDP(M, pl.s);
      (r.groups || []).forEach((g, gi) => {
        const t = data.teachers[M.tIdx.get(g.teacherId)];
        const rm = data.rooms[M.rIdx.get((pl.rooms || [])[gi])];
        out.push({
          "יום": M.cfg.days[d], "שעה": p + (M.cfg.firstPeriod || 0),
          "כיתה": (r.classIds || []).map(id => (data.classes[M.cIdx.get(id)] || {}).name).join(","),
          "מקצוע": g.subject, "מורה": t ? t.name : "", "חדר": rm ? rm.name : "", "הקבצה": r.label || "",
        });
      });
    }
    out.sort((a, b) => (M.cfg.days.indexOf(a["יום"]) - M.cfg.days.indexOf(b["יום"])) || (a["שעה"] - b["שעה"]) || a["כיתה"].localeCompare(b["כיתה"], "he"));
    return out;
  };

  return E;
}

<script>
(function () {
"use strict";
const E = SchoolEngine();
const $app = document.getElementById("app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const clone = o => JSON.parse(JSON.stringify(o));
const LS_KEY = "mishbetzet-v1", LS_CHAT = "mishbetzet-chat-v1", LS_UI = "mishbetzet-ui-v1";
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } };

// ---------------- state ----------------
const S = {
  data: null, placements: {}, daily: {}, log: [],
  ready: false, empty: false, mode: "local", canEdit: true, syncState: "ok", syncNote: "",
  tab: "timetable", by: "class", entity: null, dataTab: "teachers", filter: "",
  date: null, sel: null, move: null, modal: null, undo: [],
  agentOpen: false, chat: [], proposals: {}, agentBusy: false, agentStatus: "",
  gen: null, importState: null, files: {}, chatFile: null,
};
let M = null, TBY = new Map(), CBY = new Map(), RBY = new Map(), RQBY = new Map();
let conflictPids = new Set(), stats = null;
function remodel() {
  M = E.buildModel(S.data);
  TBY = new Map(S.data.teachers.map(t => [t.id, t]));
  CBY = new Map(S.data.classes.map(c => [c.id, c]));
  RBY = new Map(S.data.rooms.map(r => [r.id, r]));
  RQBY = new Map(S.data.reqs.map(r => [r.id, r]));
  // drop placements of removed / shrunk requirements
  for (const pid in S.placements) {
    const r = RQBY.get(E.reqOfPid(pid));
    if (!r || +pid.split(":").pop() >= r.hours) delete S.placements[pid];
  }
  const conf = E.conflicts(M, S.placements);
  conflictPids = new Set(); conf.forEach(c => c.pids.forEach(p => conflictPids.add(p)));
  stats = E.stats(M, S.placements);
  stats.conflictList = conf;
}
const tName = id => (TBY.get(id) || {}).name || "—";
const cName = id => (CBY.get(id) || {}).name || "?";
const rName = id => (RBY.get(id) || {}).name || "";
const days = () => S.data.config.days;
const fp = () => S.data.config.firstPeriod || 0;
const perLabel = p => p + fp();
const dayLabel = d => "יום " + days()[d] + "׳";

function subjFamily(s) { return String(s || "").replace(/ \d$/, "").replace(" מורחב", "").replace(/ (בנים|בנות)$/, "").trim(); }
const HUES = [212, 152, 28, 268, 352, 186, 48, 118, 320, 8, 236, 84, 292, 168, 64];
function hueOf(subject) {
  const f = subjFamily(subject); let h = 0;
  for (let i = 0; i < f.length; i++) h = (h * 31 + f.charCodeAt(i)) >>> 0;
  return HUES[h % HUES.length];
}
function reqSubjects(r) { return Array.from(new Set((r.groups || []).map(g => g.subject))); }
function reqTitle(r) { return r.label || reqSubjects(r).join(" / "); }
function reqClasses(r) { return (r.classIds || []).map(cName).join(", "); }

// dates
const pad = n => String(n).padStart(2, "0");
const isoLocal = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
function addDays(iso, n) { const [y, m, d] = iso.split("-").map(Number); const x = new Date(y, m - 1, d + n); return isoLocal(x); }
function weekday(iso) { return E.dateToDay(iso); }
function isSchoolDay(iso) { return weekday(iso) < days().length; }
function nextSchoolDay(iso, inclusive) { let x = inclusive ? iso : addDays(iso, 1); for (let i = 0; i < 8 && !isSchoolDay(x); i++) x = addDays(x, 1); return x; }
function fmtDate(iso) { const [y, m, d] = iso.split("-"); return d + "." + m + "." + y; }
function dateLabel(iso) { const wd = weekday(iso); return (wd < 6 ? "יום " + E.DAY_NAMES[wd] + "׳ " : "שבת ") + fmtDate(iso); }
const todayIso = () => isoLocal(new Date());

// ---------------- persistence ----------------
const DOCS = ["config", "teachers", "classes", "rooms", "reqs", "timetable", "log", "baseline", "proposals"];
const P = { db: null, user: null, dirty: new Set(), inflight: new Set(), again: new Set(), last: {}, timer: null };
function docBody(name) {
  if (name === "config") return S.data.config;
  if (name === "teachers") return { list: S.data.teachers };
  if (name === "classes") return { list: S.data.classes };
  if (name === "rooms") return { list: S.data.rooms };
  if (name === "reqs") return { list: S.data.reqs };
  if (name === "timetable") return { placements: S.placements, updatedAt: new Date().toISOString() };
  if (name === "log") return { entries: S.log.slice(-300) };
  if (name === "baseline") return S.baseline || { none: true };
  if (name === "proposals") return { items: trimProposals() };
  if (name.startsWith("daily:")) return S.daily[name.slice(6)] || { date: name.slice(6) };
}
function docPath(name) { return name.startsWith("daily:") ? "daily/" + name.slice(6) : "school/" + name; }
function applyDoc(name, body) {
  if (!S.data) S.data = { config: null, teachers: [], classes: [], rooms: [], reqs: [] };
  if (name === "config") S.data.config = body;
  else if (name === "timetable") S.placements = body.placements || {};
  else if (name === "log") S.log = body.entries || [];
  else if (name === "baseline") S.baseline = body.none ? null : body;
  else if (name === "proposals") S.proposals = body.items || {};
  else if (DOCS.indexOf(name) >= 0) S.data[name] = body.list || [];
}
function save(names) {
  (Array.isArray(names) ? names : [names]).forEach(n => P.dirty.add(n));
  if (S.mode === "local") { saveLocal(); P.dirty.clear(); return; }
  if (S.mode === "desktop") { P.dirty.clear(); clearTimeout(P.timer); setSync("saving"); P.timer = setTimeout(saveDesktop, 400); return; }
  clearTimeout(P.timer); P.timer = setTimeout(flush, 300);
}
async function saveDesktop() {
  try { await window.desktop.save({ data: S.data, placements: S.placements, daily: S.daily, log: S.log.slice(-300), baseline: S.baseline, proposals: trimProposals(), savedAt: new Date().toISOString() }); setSync("ok"); }
  catch (e) { setSync("bad", "השמירה במחשב נכשלה"); }
}
function saveLocal() { lsSet(LS_KEY, { data: S.data, placements: S.placements, daily: S.daily, log: S.log.slice(-300), baseline: S.baseline, proposals: trimProposals() }); }
function flush() { const names = Array.from(P.dirty); P.dirty.clear(); names.forEach(writeDoc); }
async function writeDoc(name) {
  if (P.inflight.has(name)) { P.again.add(name); return; }
  const body = docBody(name); if (!body) return;
  const json = JSON.stringify(name === "timetable" ? body.placements : body);
  if (P.last[name] === json) return;
  P.inflight.add(name); setSync("saving");
  try {
    await P.db.doc(docPath(name)).set(body);
    P.last[name] = json; setSync("ok");
  } catch (e) {
    const code = e && e.code;
    if (code === "invalid_argument") { S.canEdit = false; setSync("bad", "אין הרשאת עריכה – תצוגה בלבד"); render(); }
    else if (code === "quota_exceeded") { setSync("bad", "המאגר מלא"); toast("השמירה נכשלה: המאגר מלא. כדאי למחוק ימים יומיים ישנים."); }
    else if (code === "unavailable") { setTimeout(() => { P.dirty.add(name); flush(); }, 800 + Math.random() * 800); setSync("warn", "מנסה לשמור שוב…"); }
    else { setSync("bad", "השמירה נכשלה"); }
  } finally {
    P.inflight.delete(name);
    if (P.again.has(name)) { P.again.delete(name); writeDoc(name); }
  }
}
function setSync(state, note) { S.syncState = state; S.syncNote = note || ""; const el = document.getElementById("sync"); if (el) el.outerHTML = syncHtml(); }
function syncHtml() {
  const map = { ok: ["", S.mode === "db" ? "נשמר" : S.mode === "desktop" ? "נשמר במחשב" : "נשמר בדפדפן זה"], saving: ["warn", "שומר…"], warn: ["warn", S.syncNote], bad: ["bad", S.syncNote] };
  const [cls, txt] = map[S.syncState] || map.ok;
  return '<span class="sync" id="sync"><i class="dot ' + cls + '"></i><span class="hide-sm">' + esc(txt) + "</span></span>";
}

let renderQueued = false;
function renderSoon() { if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; render(); }); }

async function init() {
  const ui = lsGet(LS_UI) || {};
  if (ui.tab) S.tab = ui.tab; if (ui.by) S.by = ui.by; if (ui.entity) S.entity = ui.entity; if (ui.dataTab) S.dataTab = ui.dataTab;
  const chat = lsGet(LS_CHAT); if (chat) { S.chat = chat.chat || []; if (chat.proposals) S.legacyProposals = chat.proposals; }
  render();
  if (window.desktop) return initDesktop();
  let db = null, user = null;
  try { if (window.claude && window.claude.use) { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } } catch (e) { }
  P.user = user;
  if (user) { try { S.canEdit = await user.canEdit(); } catch (e) { } }
  if (!db) return initLocal();
  P.db = db; S.mode = "db";
  let gotSchool = false;
  const timer = setTimeout(() => { if (!gotSchool) { setSync("warn", "המאגר עוד לא ענה"); S.loadingSlow = true; render(); } }, 10000);
  db.collection("school").onSnapshot(snap => {
    let changed = false;
    snap.docs.forEach(doc => {
      const name = doc.id; if (!doc.exists) return;
      const body = doc.data();
      const json = JSON.stringify(name === "timetable" ? body.placements : body);
      if (P.last[name] === json) return;
      if (P.dirty.has(name) || P.inflight.has(name)) return;
      P.last[name] = json; applyDoc(name, clone(body)); changed = true;
    });
    if (!snap.metadata.fromCache) { gotSchool = true; clearTimeout(timer); S.loadingSlow = false; }
    const hasData = S.data && S.data.config;
    if (!snap.metadata.fromCache || hasData) {
      S.empty = !hasData; S.ready = true;
      if (hasData) { ensureDefaults(); remodel(); adoptLegacyProposals(); }
      if (changed || S.ready) renderSoon();
    }
  }, err => { clearTimeout(timer); setSync("bad", "החיבור למאגר נכשל"); if (!S.ready) initLocal(); });
  db.collection("daily").onSnapshot(snap => {
    let changed = false;
    snap.docs.forEach(doc => {
      const name = "daily:" + doc.id; const body = doc.data(); const json = JSON.stringify(body);
      if (P.last[name] === json || P.dirty.has(name) || P.inflight.has(name)) return;
      P.last[name] = json; S.daily[doc.id] = clone(body); changed = true;
    });
    if (changed && S.ready && !S.empty) renderSoon();
  }, () => { });
}
async function initDesktop() {
  S.mode = "desktop"; S.canEdit = true;
  const saved = await window.desktop.load();
  if (saved && saved.data && saved.data.config) { S.data = saved.data; S.placements = saved.placements || {}; S.daily = saved.daily || {}; S.log = saved.log || []; S.baseline = saved.baseline || null; S.proposals = saved.proposals || {}; }
  else { loadDemo(true); }
  S.ready = true; S.empty = false; ensureDefaults(); remodel(); adoptLegacyProposals();
  if (!saved) save(DOCS);
  try { S.desk = Object.assign({}, await window.desktop.watchGet(), await window.desktop.aiStatus(), { info: await window.desktop.info() }); } catch (e) { S.desk = {}; }
  window.desktop.onWatchFile(onWatchedFile);
  render();
}
function initLocal() {
  S.mode = "local";
  const saved = lsGet(LS_KEY);
  if (saved && saved.data && saved.data.config) { S.data = saved.data; S.placements = saved.placements || {}; S.daily = saved.daily || {}; S.log = saved.log || []; S.baseline = saved.baseline || null; S.proposals = saved.proposals || {}; }
  else { loadDemo(true); }
  S.ready = true; S.empty = false; ensureDefaults(); remodel(); adoptLegacyProposals(); render();
}
// proposals that older versions kept only in this browser: move them to the shared store once
function adoptLegacyProposals() {
  if (!S.legacyProposals || !S.canEdit) return;
  let n = 0; for (const id in S.legacyProposals) if (!S.proposals[id]) { S.proposals[id] = S.legacyProposals[id]; n++; }
  S.legacyProposals = null; lsSet(LS_CHAT, { chat: S.chat.slice(-80) });
  if (n) saveProposals();
}
function ensureDefaults() {
  const c = S.data.config;
  if (!c.days) c.days = ["א", "ב", "ג", "ד", "ה"];
  if (!c.periods) c.periods = c.days.map(() => 9);
  if (c.firstPeriod == null) c.firstPeriod = 1;
  if (!c.times) c.times = [];
  if (!c.roomTypes) c.roomTypes = Array.from(new Set(["כיתה"].concat(S.data.rooms.map(r => r.type))));
  if (!S.date) S.date = nextSchoolDay(todayIso(), true);
  if (!S.entity || !entityExists()) S.entity = firstEntity();
}
function loadDemo(silent) {
  const d = E.demoData(7);
  const res = E.generate(d, { seed: 2, timeMs: 2500 });
  S.data = d; S.placements = res.placements; S.daily = {}; S.log = []; S.baseline = null;
  addLog("ידני", "נטען בית ספר לדוגמה עם מערכת מחוללת");
  if (!silent) { S.empty = false; ensureDefaults(); remodel(); save(DOCS); render(); }
}
function persistUi() { lsSet(LS_UI, { tab: S.tab, by: S.by, entity: S.entity, dataTab: S.dataTab }); }
function persistChat() { lsSet(LS_CHAT, { chat: S.chat.slice(-80) }); }
// keep all pending + the 40 most recent decided proposals

    const n = normHe(t.name); const words = n.split(" ");

function assignRoomsForPid(pid) {

    S.data.rooms.forEach(rm => { if (rm.type === g.roomType) opts.push(rm.id); });

    const hasDay = st.map.day != null && st.map.period != null;
    h += '<div class="fgrid" style="margin-top:10px"><label class="f">סוג הנתונים<select id="imp-mode" data-a="imp-mode"><option value="timetable"' + (st.mode === "timetable" ? " selected" : "") + ">מערכת קיימת (יום + שעה לכל שיעור)</option><option value=\"reqs\"" + (st.mode === "reqs" ? " selected" : "") + ">דרישות (מורה, מקצוע, כיתה, ש״ש)</option></select></label><label class=\"f\">מה לעשות עם הנתונים הקיימים<select id=\"imp-merge\" data-a=\"imp-merge\"><option value=\"replace\"" + (st.merge !== "merge" ? " selected" : "") + '>להחליף הכול (מורים, כיתות, שיעורים)</option><option value="merge"' + (st.merge === "merge" ? " selected" : "") + ">להוסיף לקיים</option></select></label></div>";
    if (st.mode === "timetable" && !hasDay) h += '<p class="note">למערכת קיימת צריך עמודות של יום ושל שעה.</p>';

        (st.mode === "timetable" ? '<label class="row small" style="margin-top:8px"><input type="checkbox" id="imp-lock"> לנעול את כל השיבוצים מהקובץ (המחולל לא יזיז אותם; אפשר לשחרר כל שיעור בנפרד)</label>' : "") +
        '<div class="row" style="margin-top:8px"><button class="btn primary" data-a="imp-apply">' + (st.mode === "timetable" ? "טען את המערכת והתחל לעבוד עליה" : "אשר ייבוא") + "</button></div>";
    }
  }
  h += "</div>";
  h += '<div class="panel"><h3>ייצוא</h3><p class="muted small">קבצי אקסל שאפשר לפתוח, להדפיס או להעביר לשחף.</p><div class="stack" style="margin-top:8px">' +
    '<button class="btn" data-a="exp-list">רשימת שיבוצים (יום, שעה, כיתה, מקצוע, מורה, חדר)</button>' +
    '<button class="btn" data-a="exp-classes">מערכת לכל כיתה (גיליון לכל כיתה)</button>' +
    '<button class="btn" data-a="exp-teachers">מערכת לכל מורה (גיליון לכל מורה)</button>' +

  return h;
}

// ----- log view -----
function logView() {
  const entries = S.log.slice().reverse();
  let h = '<div class="panel"><div class="row"><h3 style="flex:1">יומן שינויים</h3><span class="muted small">' + entries.length + " רשומות</span></div>";
  if (!entries.length) return h + '<p class="muted small">עוד אין שינויים.</p></div>';
  h += '<table class="t" style="margin-top:8px"><thead><tr><th>מתי</th><th>מקור</th><th>שינוי</th></tr></thead><tbody>' + entries.slice(0, 200).map(e => {
    const d = new Date(e.at);
    return '<tr><td class="num small" style="white-space:nowrap">' + pad(d.getDate()) + "." + pad(d.getMonth() + 1) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + '</td><td><span class="pill' + (e.source.indexOf("סוכן") >= 0 ? " ok" : "") + '">' + esc(e.source) + "</span></td><td>" + esc(e.text) + "</td></tr>";
  }).join("") + "</tbody></table></div>";

}

// ---------------- modals ----------------
function modalHtml() {
  const m = S.modal; if (!m) return "";
  let title = "", body = "", foot = "", wide = false;
  if (m.type === "lesson") {
    const pl = S.placements[m.pid]; const r = RQBY.get(E.reqOfPid(m.pid));
    if (!r) { S.modal = null; return ""; }
    title = reqTitle(r);
    body = '<div class="row"><span class="pill">' + esc(reqClasses(r)) + "</span>" + (pl ? '<span class="pill">' + esc(slotText(pl.s)) + "</span>" : '<span class="pill warn">לא משובץ</span>') + (pl && pl.locked ? '<span class="pill">🔒 נעול</span>' : "") + "</div>";
    body += '<table class="t"><thead><tr><th>מקצוע</th><th>מורה</th><th>חדר</th><th></th></tr></thead><tbody>' + r.groups.map((g, gi) => "<tr><td>" + esc(g.subject) + "</td><td>" + esc(tName(g.teacherId)) + "</td><td>" + (g.roomType === "none" ? '<span class="muted">ללא</span>' : pl && pl.rooms && pl.rooms[gi] ? esc(rName(pl.rooms[gi])) : '<span class="muted">—</span>') + "</td><td>" + (pl && S.canEdit && g.roomType !== "none" ? '<button class="btn sm" data-a="room-pick" data-pid="' + esc(m.pid) + '" data-gi="' + gi + '">בחירת חדר</button>' : "") + "</td></tr>").join("") + "</tbody></table>";
    const issues = pl ? stats.conflictList.filter(c => c.pids.indexOf(m.pid) >= 0) : [];
    if (issues.length) body += '<div class="note bad">' + issues.map(c => esc(E.CONFLICT_TEXT[c.kind] + (c.who ? " – " + c.who : ""))).join("<br>") + "</div>";
    if (S.canEdit) foot = '<button class="btn primary" data-a="move-start" data-pid="' + esc(m.pid) + '">העברה</button>' + (pl ? '<button class="btn" data-a="' + (pl.locked ? "unlock" : "lock") + '" data-pid="' + esc(m.pid) + '">' + (pl.locked ? "שחרור נעילה" : "נעילה") + '</button><button class="btn ghost" data-a="unschedule" data-pid="' + esc(m.pid) + '">הוצאה מהמערכת</button>' : "") + '<button class="btn ghost" data-a="edit" data-kind="reqs" data-id="' + esc(r.id) + '">עריכת השיעור</button>';
  } else if (m.type === "room") {
    const pl = S.placements[m.pid]; const r = RQBY.get(E.reqOfPid(m.pid)); const g = r.groups[m.gi];
    title = "בחירת חדר – " + slotText(pl.s);
    const free = new Set(E.freeRooms(M, S.placements, pl.s, m.pid).map(x => x.id));
    const cur = (pl.rooms || [])[m.gi];
    (pl.rooms || []).forEach((x, i) => { if (i !== m.gi && x) free.delete(x); });
    const occ = {}; for (const q in S.placements) { const p2 = S.placements[q]; if (p2.s === pl.s && q !== m.pid) (p2.rooms || []).forEach(x => { if (x) occ[x] = q; }); }
    const types = Array.from(new Set(S.data.rooms.map(x => x.type)));
    body = '<p class="muted small" style="margin:0">' + esc(g.subject) + " · " + esc(reqClasses(r)) + " · נדרש: " + esc(g.roomType) + (groupNeed(r, m.gi) ? " · " + groupNeed(r, m.gi) + " תלמידים" : "") + "</p>";
    types.sort((a, b) => (b === g.roomType) - (a === g.roomType)).forEach(ty => {
      body += "<h3>" + esc(ty) + '</h3><div class="roomlist">' + S.data.rooms.filter(x => x.type === ty).map(x => {
        const isFree = free.has(x.id) || x.id === cur;
        const need = groupNeed(r, m.gi); const small = need && x.capacity && x.capacity < need;
        return '<button data-a="room-set" data-pid="' + esc(m.pid) + '" data-gi="' + m.gi + '" data-room="' + x.id + '"' + (x.id === cur ? ' class="cur"' : "") + (isFree ? "" : " disabled") + ">" + esc(x.name) + (x.capacity ? ' <span class="num muted">' + x.capacity + "</span>" : "") + "<small" + (small ? ' style="color:var(--warn)"' : "") + ">" + (x.id === cur ? "נוכחי" : isFree ? (small ? "פנוי, קטן מדי" : "פנוי") : "תפוס: " + esc(pidTitle(occ[x.id] || ""))) + "</small></button>";
      }).join("") + "</div>";
    });
  } else if (m.type === "diagnose") {
    const r = RQBY.get(m.req); title = "למה " + reqTitle(r) + " לא משובץ?";
    body = '<ul style="margin:0;padding-inline-start:18px">' + E.diagnose(M, m.req).map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>";
    foot = '<button class="btn" data-a="edit" data-kind="reqs" data-id="' + esc(m.req) + '">עריכת השיעור</button>';

  else if (m.type === "edit") { wide = m.kind === "reqs"; ({ title, body, foot } = editModal(m)); }
  else if (m.type === "event") ({ title, body, foot } = eventModal(m));
  else if (m.type === "day-lesson") ({ title, body, foot } = dayLessonModal(m));
  else if (m.type === "auto") {
    title = m.title || "סידור אוטומטי – " + dateLabel(S.date);
    const notes = (m.notes || []).map(n => '<div class="note">' + esc(n) + "</div>").join("");
    if (!m.changes.length) body = notes + '<p style="margin:0">אין שיעורים לא מכוסים ביום הזה.</p>';
    else body = notes + '<p class="muted small" style="margin:0">' + (m.title ? "החדרים, המשגיחים וההזזות שהמערכת מציעה. שום דבר לא משתנה עד האישור." : 'לכל שיעור לא מכוסה: מחליף/ה טוב/ה אם יש (בחלון, אותו מקצוע, מכיר/ה את הכיתה), אחרת "מבוטל" בתחילת או סוף היום, ואחרת "חלון". שיעורים בחדר שתפוס לבחינה עוברים לחדר פנוי.') + ' אפשר לבטל סימון לפני האישור.</p><ul style="list-style:none;margin:0;padding:0;display:grid;gap:6px">' + m.changes.map((c, i) => '<li class="row" style="align-items:flex-start"><input type="checkbox" id="auto-' + i + '" checked style="margin-top:3px"><label for="auto-' + i + '" style="flex:1">' + esc(describeChange(c).text) + "</label></li>").join("") + "</ul>";
    foot = m.changes.length ? '<button class="btn primary" data-a="auto-apply">אישור המסומנים</button>' : "";
  }
  else if (m.type === "incident") { ({ title, body, foot } = incModal(m)); wide = m.step === 2; }
  else if (m.type === "homerooms") {
    const r = m.res; title = "שיבוץ חדרי אם לפי גודל הכיתה";

      '<div style="overflow-x:auto;max-height:46vh"><table class="t small"><thead><tr><th>כיתה</th><th>תלמידים</th><th>חדר נוכחי</th><th>חדר חדש</th><th>מקומות</th></tr></thead><tbody>' +
      S.data.classes.slice().sort((a, b) => (+b.students || 0) - (+a.students || 0)).map(c => { const nr = RBY.get(r.map[c.id]); const ch = c.homeRoom !== r.map[c.id]; return "<tr><td>" + esc(c.name) + '</td><td class="num">' + (c.students || "—") + "</td><td>" + esc(rName(c.homeRoom) || "—") + "</td><td>" + (ch ? "<b>" + esc(nr ? nr.name : "—") + "</b>" : esc(nr ? nr.name : "—")) + '</td><td class="num">' + (nr && nr.capacity ? nr.capacity : "") + "</td></tr>"; }).join("") + "</tbody></table></div>" +
      '<p class="muted small" style="margin:0">' + r.changes.length + " שיעורים של הכיתות יעברו לחדר האם החדש (בשעות שבהן הוא פנוי). אחר כך מומלץ להריץ \"סידור חדרים לפי גודל\" לשאר השיעורים.</p>";
    foot = '<button class="btn primary" data-a="homerooms-apply">החלה</button>';
  }
  else if (m.type === "roomopt") {
    const st = m.res.stats;
    title = "סידור חדרים לפי גודל";

function openGenerate(keepExisting) { S.gen = { keepExisting: keepExisting || !!S.baseline }; S.modal = { type: "generate" }; render(); }
let worker = null;
function runGenerator() {
  const keepLocked = (document.getElementById("gen-locked") || {}).checked !== false;
  const keepAll = !!(document.getElementById("gen-keep") || {}).checked;
  const timeMs = +((document.getElementById("gen-time") || {}).value || 15000);
  S.gen = { running: true, keepExisting: keepAll, elapsed: 0, opts: { keepLocked, keepAll, timeMs } };
  render();
  const t0 = Date.now();
  const tick = setInterval(() => { if (!S.gen || !S.gen.running) return clearInterval(tick); S.gen.elapsed = Math.min(1, (Date.now() - t0) / timeMs); const bar = document.querySelector(".bar i"); if (bar) bar.style.width = Math.round(S.gen.elapsed * 100) + "%"; }, 250);
  const payload = { data: S.data, opts: { seed: (Math.random() * 1e9) | 0, placements: S.placements, keepLocked, keepAll, timeMs } };
  const done = res => { clearInterval(tick); if (!S.gen || !S.gen.running) return; S.gen = { result: res, keepExisting: keepAll }; render(); };
  try {
    const src = SchoolEngine.toString() + "\nconst E=SchoolEngine();onmessage=function(e){var d=e.data;var r=E.generate(d.data,Object.assign({},d.opts,{onProgress:function(p){postMessage({progress:p})}}));postMessage({done:r});};";
    worker = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
    worker.onmessage = e => { if (e.data.progress) { if (S.gen) S.gen.progress = e.data.progress; } else if (e.data.done) { worker.terminate(); worker = null; done(e.data.done); } };
    worker.onerror = () => { worker = null; setTimeout(() => done(E.generate(payload.data, Object.assign({}, payload.opts, { timeMs: Math.min(timeMs, 4000) }))), 30); };
    worker.postMessage(payload);
  } catch (e) { setTimeout(() => done(E.generate(payload.data, Object.assign({}, payload.opts, { timeMs: Math.min(timeMs, 4000) }))), 30); }
}

// ---------------- import / export ----------------
function tableFromText(text) {
  const lines = String(text).replace(/\r/g, "").split("\n").filter(l => l.trim());
  if (lines.length < 2) return null;
  const sep = lines[0].indexOf("\t") >= 0 ? "\t" : (lines[0].indexOf(";") >= 0 ? ";" : ",");
  const rows = lines.map(l => l.split(sep));
  // header = first row among the first 10 that matches the most known columns
  let bi = 0, bn = -1; for (let i = 0; i < Math.min(rows.length, 10); i++) { const n = Object.keys(E.detectColumns(rows[i])).length; if (n > bn) { bn = n; bi = i; } }
  return { headers: rows[bi].map(x => String(x).trim()), rows: rows.slice(bi + 1).filter(r => r.some(x => String(x).trim())) };
}
function tableFromBuffer(buf, name) {
  name = String(name || "").toLowerCase();
  if (name.endsWith(".csv") || name.endsWith(".txt")) return tableFromText(decodeText(buf));
  if (!window.XLSX) throw new Error("קריאת אקסל לא נטענה");
  const wb = XLSX.read(new Uint8Array(buf), { type: "array" });
  let best = null;
  wb.SheetNames.forEach(sn => {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: "" });
    for (let i = 0; i < Math.min(rows.length, 15); i++) { const n = Object.keys(E.detectColumns(rows[i].map(String))).length; if (!best || n > best.n) best = { n, sn, i, rows }; }
  });
  const grid = gridTable(wb, best);
  if (grid) return grid;
  if (!best) return null;
  return { headers: best.rows[best.i].map(x => String(x).trim()), rows: best.rows.slice(best.i + 1).filter(r => r.some(x => String(x == null ? "" : x).trim() !== "")), sheet: best.sn };
}
// a workbook of timetable grids (table per class) -> flat table. Used when no flat list with teacher/subject/class columns was found.
function gridTable(wb, best) {
  const flatOk = best && (() => { const m = E.detectColumns(best.rows[best.i].map(String)); return m.teacher != null && m.subject != null && m.klass != null; })();
  if (flatOk) return null;
  const sheets = wb.SheetNames.map(sn => ({ name: sn, aoa: XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: "" }) }));
  const g = E.gridToRows(sheets); if (!g) return null;
  return { headers: ["יום", "שעה", "כיתה", "מקצוע", "מורה", "חדר"], rows: g.rows.map(r => [r.day, r.period, r.klass, r.subject, r.teacher, r.room]), sheet: "טבלאות מערכת של " + g.classes.length + " כיתות", grid: true };
}

let currentAgentMsg = null;
function toolsWithinLimits(list) {
  const enc = new TextEncoder();
  return list.map(t => {
    let d = t.description; while (enc.encode(d).length > 1000) d = d.slice(0, -20);
    return d === t.description ? t : Object.assign({}, t, { description: d });
  });
}
const FIELD_NAMES = { teacher: "מורה", subject: "מקצוע", klass: "כיתה", day: "יום", period: "שעה", room: "חדר", hours: "ש״ש", group: "הקבצה" };

function buildMessages() {
  const msgs = [];
  msgs.push({ role: "user", content: AGENT_RULES + "\n\n=== מצב המערכת עכשיו ===\n" + agentContext() + "\n\n=== סוף המצב. השיחה מתחילה בהמשך. ===" });
  msgs.push({ role: "assistant", content: "הבנתי. אני אחראי המערכת ואציע כל שינוי דרך propose_changes לאישור." });
  S.chat.slice(-24).forEach(m => {
    if (m.pending) return;
    let role = m.role === "sys" ? "user" : m.role; let content = m.content || "";
    if (m.role === "sys") content = "[הודעת מערכת] " + content;
    if (m.role === "assistant" && m.proposals) m.proposals.forEach(pid => { const p = S.proposals[pid]; if (p) content += "\n[הצעה \"" + p.summary + "\": " + p.changes.map(c => (c.desc || describeChange(c)).text).join("; ") + " – " + (p.feedback || "ממתינה לאישור") + "]"; });
    if (!content) return;
    const last = msgs[msgs.length - 1];
    if (last.role === role) last.content += "\n\n" + content; else msgs.push({ role, content });
  });
  if (msgs[msgs.length - 1].role !== "user") msgs.push({ role: "user", content: "המשך/י." });

}
async function agentSend(text) {
  if (S.agentBusy) return;

    const id = E.uid("f"); S.files[id] = S.chatFile; S.chatFile = null;
    const f = S.files[id]; const map = E.detectColumns(f.table.headers);
    const mapped = Object.keys(map).map(k => FIELD_NAMES[k] + "=" + f.table.headers[map[k]]).join(", ");

      const tools = max >= AGENT_TOOLS.length ? AGENT_TOOLS : AGENT_TOOLS.filter(t => ["propose_changes", "decide_proposal", "day_lessons", "plan_exam", "plan_workshops", "find_teachers", "find_substitutes", "auto_arrange", "inspect_file", "get_schedule", "search_lessons", "free_at", "check_move", "get_report", "free_slots"].slice(0, max).indexOf(t.name) >= 0);

        onText: ({ text }) => { msg.content = cleanAgentText(text); const els = document.querySelectorAll(".msg.assistant"); const el = els[els.length - 1]; if (el && el.firstChild && el.firstChild.nodeType === 3) el.firstChild.nodeValue = msg.content; else renderSoon(); },

      const out = await sample.json(msgs, { modelTier: "default", signal: agentCtrl.signal });

async function agentSendDesktop() {
  const st = await window.desktop.aiStatus();
